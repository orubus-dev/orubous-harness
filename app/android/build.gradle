allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
    // file_picker's flutter_plugin_android_lifecycle AAR demands compileSdk 36;
    // plugin subprojects otherwise inherit Flutter's default (34) and fail
    // CheckAarMetadata. Force every Android library subproject to 36.
    // NB: :app is already evaluated here (evaluationDependsOn) — afterEvaluate
    // would throw, and :app pins its own compileSdk anyway.
    if (project.name != "app") {
        afterEvaluate { subproject ->
            if (subproject.hasProperty('android')) {
                try {
                    subproject.android.compileSdkVersion 36
                } catch (Exception ignored) {
                    // non-Android subprojects have no android block
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
